<!DOCTYPE html>
<html lang="vi" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thiệp cưới Quang Long &amp; Minh Nguyệt</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(to bottom right, #6e1a20, #511419, #380a0e); color: #ece4d8;
      font-family: 'Times New Roman', serif; padding: 24px; box-sizing: border-box; }
    .card { width: 100%; max-width: 440px; text-align: center;
      background: rgba(255, 250, 243, 0.97); color: #511419; border: 1px solid rgba(81,20,25,.15);
      border-radius: 14px; padding: 40px 28px 34px; box-shadow: 0 25px 60px -12px rgba(0,0,0,.45); }
    .eyebrow { letter-spacing: .22em; font-size: 13px; text-transform: uppercase; color: #8a2a30; margin: 0 0 14px; }
    .names { font-family: 'Great Vibes', cursive; line-height: 1.15; color: #511419; margin: 6px 0; }
    .names .n { font-size: clamp(34px, 9vw, 46px); display: block; }
    .amp { font-size: 26px; opacity: .5; margin: 2px 0; }
    .date { color: rgba(81,20,25,.72); font-size: 17px; margin: 10px 0 4px; }
    .rule { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0 22px; }
    .rule span { color: #511419; opacity: .7; }
    .rule i { height: 1px; width: 44px; display: inline-block; }
    .rule i.l { background: linear-gradient(to right, transparent, #511419); }
    .rule i.r { background: linear-gradient(to left, transparent, #511419); }
    .pick { font-size: 14px; color: rgba(81,20,25,.7); margin-bottom: 14px; }
    .btns { display: flex; flex-direction: column; gap: 12px; }
    a.btn { display: block; text-decoration: none; padding: 14px 18px; border-radius: 999px;
      background: #511419; color: #f3e8de; font-size: 16px; letter-spacing: .02em;
      box-shadow: 0 4px 14px rgba(81,20,25,.35); transition: transform .15s ease, background .15s ease; }
    a.btn:hover { transform: translateY(-1px); background: #6e1a20; }
    a.btn small { display: block; font-size: 12px; opacity: .75; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Save The Date</p>
    <div class="names">
      <span class="n">Nguyễn Quang Long</span>
      <span class="amp">&amp;</span>
      <span class="n">Nguyễn Thị Minh Nguyệt</span>
    </div>
    <div class="date">27 tháng 11, 2026</div>
    <div class="rule"><i class="l"></i><span>❦</span><i class="r"></i></div>
    <p class="pick">Mời bạn chọn thiệp</p>
    <div class="btns">
      <a class="btn" href="quanglong2210/"><small>Nhà Trai</small>Thiệp mời dự Lễ cưới</a>
      <a class="btn" href="minhnguyet0910/"><small>Nhà Gái</small>Thiệp mời dự Lễ cưới</a>
    </div>
  </div>
</body>
</html>

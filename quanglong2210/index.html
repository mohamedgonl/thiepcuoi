<!DOCTYPE html>
<html lang="vi" dir="ltr" data-theme="halloween">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thiệp cưới</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>html,body{background:#511419;margin:0}</style>
</head>
<body class="font-sans">
  <script>window.SHARED_BASE="../";</script>
  <script src="config.js"></script>
  <script>
    fetch("../invite.html").then(function(r){return r.text();}).then(function(h){
      var o=h.indexOf("<body"); var s=h.indexOf(">",o)+1; var e=h.lastIndexOf("</body>");
      document.body.insertAdjacentHTML("beforeend", h.slice(s,e));
      var sc=document.createElement("script"); sc.src="../js/render.js"; document.body.appendChild(sc);
    });
  </script>
</body>
</html>
